name: gwaithh
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logogwaith.png"
  adaptive_icon_background: "#155034"
  adaptive_icon_foreground: "assets/images/logogwaith.png"
  adaptive_icon_foreground_scale: 1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/